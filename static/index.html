<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Late Tracker | SMIT IT Dept</title>
    <meta name="description" content="Track student late arrivals efficiently.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div id="toast" class="toast"></div>

    <!-- Auth View -->
    <div id="auth-view" class="view active">
        <div class="auth-container glass">
            <h2>Sign In</h2>
            <p>SMIT IT Dept Late Tracker</p>
            
            <form id="login-form">
                <div class="input-group">
                    <label for="username">Username / Rep ID</label>
                    <input type="text" id="username" required placeholder="e.g. hod, staff1, rep2">
                </div>
                <div class="input-group">
                    <label for="password">Password / PIN</label>
                    <input type="password" id="password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
            
            <div class="divider"><span>OR</span></div>
            <button class="btn-outline" onclick="alert('Google Sign-In is disabled until OAuth credentials are provided.')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Sign in with Google
            </button>
        </div>
    </div>

    <!-- Main Layout (Navbar + Content) -->
    <div id="main-layout" class="view">
        <nav class="navbar glass">
            <div class="nav-brand">Late Tracker</div>
            <div class="nav-links">
                <button id="nav-tracker" class="nav-item active">Tracker</button>
                <button id="nav-dashboard" class="nav-item">Dashboard</button>
                <button id="btn-logout" class="nav-item text-danger">Logout</button>
            </div>
        </nav>

        <div class="content">
            <!-- Tracker View -->
            <div id="tracker-view" class="sub-view active">
                <div class="header-section">
                    <h2>Mark Late Arrivals</h2>
                    <p id="tracker-role-info"></p>
                </div>

                <div class="selection-card glass">
                    <h3>1. Select Year & Session</h3>
                    <div class="pill-group" id="year-selector">
                        <button class="pill" data-value="2nd_year">2nd Year</button>
                        <button class="pill" data-value="3rd_year">3rd Year</button>
                        <button class="pill" data-value="4th_year">4th Year</button>
                    </div>
                    
                    <div class="pill-group mt-3" id="session-selector">
                        <button class="pill" data-value="Morning">Morning</button>
                        <button class="pill" data-value="After Break">After Break</button>
                        <button class="pill" data-value="After Lunch">After Lunch</button>
                    </div>
                </div>

                <div class="selection-card glass mt-4">
                    <div class="flex-between">
                        <h3>2. Select Students</h3>
                        <span id="selected-count">0 selected</span>
                    </div>
                    
                    <div class="search-box mt-3">
                        <input type="text" id="student-search" placeholder="Search by name or reg no...">
                    </div>

                    <div id="student-list" class="student-grid mt-3">
                        <!-- Student cards will be injected here -->
                    </div>
                </div>

                <div class="action-bar glass">
                    <button id="btn-submit-late" class="btn-primary w-100" disabled>Submit Late Entry</button>
                </div>
            </div>

            <!-- Dashboard View -->
            <div id="dashboard-view" class="sub-view">
                <div class="header-section flex-between">
                    <h2>Dashboard</h2>
                    <button id="btn-export" class="btn-outline">Export CSV</button>
                </div>

                <div class="stats-grid mt-4" id="stats-container">
                    <!-- Stats will be injected here -->
                </div>

                <div class="table-container glass mt-4">
                    <div class="flex-between mb-3">
                        <h3>Recent Logs</h3>
                        <div class="filters">
                            <input type="date" id="filter-date">
                            <select id="filter-year">
                                <option value="">All Years</option>
                                <option value="2nd_year">2nd Year</option>
                                <option value="3rd_year">3rd Year</option>
                                <option value="4th_year">4th Year</option>
                            </select>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table id="logs-table">
                            <thead>
                                <tr>
                                    <th>Date/Time</th>
                                    <th>Session</th>
                                    <th>Reg No</th>
                                    <th>Name</th>
                                    <th>Year</th>
                                    <th id="col-action">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Logs injected here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
